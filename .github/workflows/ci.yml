# BELUM DIJALANKAN: repo ini belum memakai git/GitHub saat berkas ini ditulis.
# Menguji dengan MySQL sebagai service container. Job "tanpa Docker" (MySQL terpasang langsung) belum ada.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      TEST_DATABASE_URL: mysql://root:@127.0.0.1:3306/naqdi_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: apps/web
      - run: npm run typecheck
      - run: npx tsc --noEmit
        working-directory: apps/web
      - run: npm test
      - run: npm run build
